name: Workflow documents and guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check indexed documentation and credentials
        run: python3 scripts/check_workflow.py
      - name: Test the guard
        run: python3 -B -m unittest discover -s tests -v
